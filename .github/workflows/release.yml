name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: citadel-app
          repositories: citadel,citadel-desktop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-package-lock
        env:
          CITADEL_RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Build
        run: npm run build
        env:
          MAIN_VITE_GITHUB_CLIENT_ID: ${{ secrets.CITADEL_GITHUB_CLIENT_ID }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CITADEL_RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Get Version
        id: get_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: ZIP Payload
        run: zip -r citadel-payload.zip out/ package.json

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          files: |
            citadel-payload.zip
            package.json
          generate_release_notes: true
          draft: false
          prerelease: false
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Trigger Publish Workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/citadel-app/citadel/dispatches \
            -d '{"event_type": "trigger-publish"}'
