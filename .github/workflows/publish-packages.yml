name: Publish Packages

on:
  release:
    types: [published]
  repository_dispatch:
    types: [trigger-publish]
  workflow_dispatch:

# Unified Node.js version for stability

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com/"
          scope: "@citadel-app"

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-package-lock

      - name: Build Core
        run: npm run build
        working-directory: packages/core

      - name: Publish Core
        run: npm publish
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Build UI
        run: npm run build
        working-directory: packages/ui

      - name: Publish UI
        run: npm publish
        working-directory: packages/ui
        env:
          NODE_AUTH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Build App
        run: npm run build
        env:
          MAIN_VITE_GITHUB_CLIENT_ID: ${{ secrets.CITADEL_GITHUB_CLIENT_ID }}

      - name: Publish App
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Trigger Desktop Build
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            https://api.github.com/repos/citadel-app/citadel-desktop/dispatches \
            -d '{"event_type": "new-core-release"}'
