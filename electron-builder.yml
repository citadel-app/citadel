appId: com.citadel.app
productName: Citadel
publish:
  provider: github
  owner: citadel-app
  repo: citadel-desktop
  releaseType: draft
# Application version is automatically pulled from package.json
directories:
  buildResources: build
protocols:
  - name: Citadel Protocol
    schemes:
      - citadel
      - codex
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  - "!.venv/*"
  - "!data-sources/*"
  - "!resources/Citadel Banners/*"
  - "!resources/Citadel Logos/*"
  - "!resources/logo-main.png"
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**
extraResources:
  - from: docs
    to: docs
  - from: docker-compose.yml
    to: tts-service/docker-compose.yml
win:
  executableName: Citadel
  icon: resources/icon.png
  forceCodeSigning: false
  target:
    - nsis
    - portable
portable:
  artifactName: ${name}-${version}-${arch}-portable.${ext}
cscLink: null
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - target: dmg
      arch:
        - universal
        - arm64
        - x64
    - target: zip
      arch:
        - universal
        - arm64
        - x64
  identity: null
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  icon: resources/icon.png
  target:
    - AppImage
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
